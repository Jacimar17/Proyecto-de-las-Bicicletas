<div class="admin-container">
  <div class="header">
    <h2>🚲 Panel de Administración</h2>
    <button mat-raised-button color="primary" (click)="mostrarFormulario = !mostrarFormulario">
      {{ mostrarFormulario ? 'Cancelar' : '+ Nueva Bicicleta' }}
    </button>
  </div>

  <!-- Formulario nueva bicicleta -->
  <mat-card *ngIf="mostrarFormulario" class="formulario">
    <mat-card-header><mat-card-title>Nueva Bicicleta</mat-card-title></mat-card-header>
    <mat-card-content>
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Código</mat-label>
          <input matInput [(ngModel)]="nueva.codigo" placeholder="BICI-001" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Modelo</mat-label>
          <input matInput [(ngModel)]="nueva.modelo" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Ubicación</mat-label>
          <input matInput [(ngModel)]="nueva.ubicacion" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Estado</mat-label>
          <mat-select [(ngModel)]="nueva.estado">
            <mat-option *ngFor="let e of estados" [value]="e">{{ e }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="crear()">Guardar</button>
    </mat-card-actions>
  </mat-card>

  <!-- Tabla de bicicletas -->
  <table mat-table [dataSource]="bicicletas" class="tabla">

    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let b">{{ b.codigo }}</td>
    </ng-container>

    <ng-container matColumnDef="modelo">
      <th mat-header-cell *matHeaderCellDef>Modelo</th>
      <td mat-cell *matCellDef="let b">{{ b.modelo }}</td>
    </ng-container>

    <ng-container matColumnDef="ubicacion">
      <th mat-header-cell *matHeaderCellDef>Ubicación</th>
      <td mat-cell *matCellDef="let b">{{ b.ubicacion }}</td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let b">
        <mat-select [value]="b.estado" (selectionChange)="cambiarEstado(b, $event.value)">
          <mat-option *ngFor="let e of estados" [value]="e">{{ e }}</mat-option>
        </mat-select>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let b">
        <button mat-icon-button color="warn" (click)="eliminar(b.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
  </table>

  <p *ngIf="bicicletas.length === 0" class="sin-datos">No hay bicicletas cargadas.</p>
</div>
