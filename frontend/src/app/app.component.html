<div class="app-shell">
  <header class="app-header">
    <a class="brand" routerLink="/mapa" aria-label="BiciVT, ir al mapa">
      <span class="brand-mark" aria-hidden="true">🚲</span>
      <span class="brand-copy">
        <strong>BiciVT</strong>
        <span>Movilidad compartida</span>
      </span>
    </a>

    <nav class="primary-nav" aria-label="Navegación principal">
      <a routerLink="/mapa" routerLinkActive="active" ariaCurrentWhenActive="page">Mapa</a>
      <a routerLink="/perfil" routerLinkActive="active" ariaCurrentWhenActive="page" *ngIf="usuarioService.usuarioActual">Perfil</a>
      <a *ngIf="usuarioService.usuarioActual?.role === 'cliente'" routerLink="/viajes" routerLinkActive="active" ariaCurrentWhenActive="page">Mis viajes</a>
      <a *ngIf="usuarioService.usuarioActual?.role === 'admin'" routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page">Administración</a>
      <a *ngIf="usuarioService.usuarioActual?.role === 'tecnico'" routerLink="/tecnico" routerLinkActive="active" ariaCurrentWhenActive="page">Mantenimiento</a>
    </nav>

    <div class="header-actions">
      <ng-container *ngIf="usuarioService.usuarioActual; else visitorActions">
        <span class="user-role">{{ usuarioService.usuarioActual.role }}</span>
        <button type="button" class="logout-button" (click)="cerrarSesion()">Cerrar sesión</button>
      </ng-container>
      <ng-template #visitorActions>
        <a class="login-link" routerLink="/login">Ingresar</a>
        <a class="register-link" routerLink="/registro">Crear cuenta</a>
      </ng-template>
    </div>
  </header>

  <div class="app-main">
    <router-outlet />
  </div>
</div>
<app-notification-modal />
